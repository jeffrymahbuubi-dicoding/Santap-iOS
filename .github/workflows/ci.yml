name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SwiftLint when missing
        run: command -v swiftlint || brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict

  build-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PACKAGES: Common Restaurant Home Detail Favorite About
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        shell: bash
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available \
            | awk '/^-- /{ios = ($0 ~ /^-- iOS /)} ios && /iPhone/{print}' \
            | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' \
            | head -n 1)
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found on this runner." >&2
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "RESULTS=$RUNNER_TEMP/results" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/results"

      - name: Test the packages
        shell: bash
        run: |
          failed=0
          for name in $PACKAGES; do
            echo "::group::Test package $name"
            (cd "Modules/$name" && xcodebuild test \
              -scheme "$name" \
              -destination "platform=iOS Simulator,id=$UDID" \
              -enableCodeCoverage YES \
              -resultBundlePath "$RESULTS/pkg-$name.xcresult") || failed=1
            echo "::endgroup::"
          done
          exit $failed

      - name: Build and test the app
        shell: bash
        run: |
          xcodebuild \
            -project Santap.xcodeproj \
            -scheme Santap \
            -destination "platform=iOS Simulator,id=$UDID" \
            -enableCodeCoverage YES \
            -resultBundlePath "$RESULTS/app.xcresult" \
            -skip-testing:SantapUITests \
            clean build test CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Code coverage"
            for bundle in "$RESULTS"/*.xcresult; do
              [ -d "$bundle" ] || continue
              echo
              echo "### $(basename "$bundle" .xcresult)"
              echo
              echo '```'
              xcrun xccov view --report --only-targets "$bundle" || echo "no coverage data"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result bundles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-bundles
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
